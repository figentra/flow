# Figentra Flow file contract:
# Purpose: the Quality Gate: install, format check, lint, typecheck and build on every PR and push to main (`verify`,
#          the required check), and the package's tests (`test`, owner default O4, 2026-11-04: Flow's tests run in
#          its own CI). On a pull request typecheck and build run for the members the change affects, against the base
#          commit; the tests always run in full. `e2e` (STA-1945 T121, not required) packs the package and installs the
#          tarball from the public registries into a scratch repository, as an outsider would, then runs `fflow`.
# Owner: release-operations
# Secrets: none; the @stackra scope's registry is read-only and public for this job.
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.11.4
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - env:
          AFFECTED: ${{ github.event_name == 'pull_request' && '1' || '' }}
          TURBO_SCM_BASE: HEAD~1 # a PR checks out its merge into main, so HEAD~1 is main and the diff is the PR's own
        run: pnpm exec turbo run typecheck build ${AFFECTED:+--affected}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.11.4
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @figentra-oss/flow test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.11.4
          install_args: node pnpm
      # No install: the test packs the package and installs the tarball from the registries itself.
      - run: pnpm --filter @figentra-oss/flow test:e2e
