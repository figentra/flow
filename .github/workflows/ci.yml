# Figentra Flow file contract:
# Purpose: the Quality Gate: install, format check, lint, typecheck, test and build on every PR and push to main.
# Owner: release-operations
# Secrets: none; the @stackra scope's registry is read-only and public for this job.
name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
