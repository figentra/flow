# Figentra Flow file contract:
# Purpose: pnpm workspace membership (one package, packages/flow) and the version catalogs its package.json
#          references resolve against. Versions match Stackra core's catalogs.
# Owner: release-operations
# Secrets: forbidden
packages:
  - packages/*

catalogMode: strict
engineStrict: true
# A `pnpm <script>` or `pnpm exec` never installs on its own (pnpm 12 installed whole workspaces from commit hooks
# on a Mac, 2026-11-03); it warns, and installs run on the box and in CI.
verifyDepsBeforeRun: warn

catalog:
  # The one CLI engine every Figentra CLI depends on (STA-1966, STA-1945 FR-31; ADR 0506 decision 8, owner 2026-11-03):
  # runtime dependencies, loaded by the CLI layer only, never by the governance core or `fflow guard`. Exact pins.
  "@stackra/console": 0.21.0
  "@stackra/validation": 0.21.0
  "@types/node": 26.6.4
  # The Linear client's network layer: an Agent with a 30 s connect timeout (STA-302), as in Stackra core.
  undici: 8.12.2

catalogs:
  build:
    turbo: 2.11.9
    # TypeScript 6: checks the plain-JS sources (allowJs + checkJs) and emits their declarations.
    typescript: 6.0.3
  quality:
    oxlint: 1.86.0
    oxfmt: 0.71.0
  release:
    "@changesets/cli": 3.0.3
    "@changesets/changelog-git": 1.0.0
    lefthook: 2.2.1
    # Released Flow, aliased: the approval workflow pins its lockfile integrity (the workspace copy has none).
    flow-released: npm:@figentra-oss/flow@0.9.2

# Install scripts allowed to run (reviewed); any other fails install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  lefthook: true
minimumReleaseAgeExclude:
  # Figentra's own open packages install the day they publish (owner, 2026-11-09).
  - "@figentra-oss/*"
  # Our own engine, published from core's CI (STA-1966); 0.21.0 since 2026-11-08.
  - "@stackra/console@0.21.0"
  - "@stackra/container@0.21.0"
  - "@stackra/contracts@0.21.0"
  - "@stackra/validation@0.21.0"
