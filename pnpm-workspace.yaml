# Figentra Flow file contract:
# Purpose: pnpm workspace membership (one package, packages/figentra-flow) and the version catalogs its package.json
#          references resolve against. Versions match Stackra core's catalogs.
# Owner: release-operations
# Secrets: forbidden
packages:
  - packages/*

catalogMode: strict
engineStrict: true

catalog:
  # The one CLI engine every Figentra CLI runs on (STA-1966, STA-1945 FR-31). Flow takes it as an optional peer and a dev
  # dependency, never a runtime one (NFR-1); without it `fflow` prints plain text. Exact pins.
  "@stackra/console": 0.6.1
  "@stackra/validation": 0.6.1
  "@types/node": 26.6.4
  # The Linear client's network layer: an Agent with a 30 s connect timeout (STA-302), as in Stackra core.
  undici: 8.12.2

catalogs:
  build:
    turbo: 2.11.9
    # TypeScript 6: checks the plain-JS sources (allowJs + checkJs) and emits their declarations.
    typescript: 6.0.3
  quality:
    oxlint: 1.86.0
    oxfmt: 0.71.0
  release:
    "@changesets/cli": 3.0.3
    "@changesets/changelog-git": 1.0.0
    lefthook: 2.2.1
    # Released Flow, aliased: the approval workflow pins its lockfile integrity (the workspace copy has none).
    flow-released: npm:@figentra-oss/flow@0.2.3

# Install scripts allowed to run (reviewed); any other fails install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  lefthook: true
minimumReleaseAgeExclude:
  - "@figentra-oss/flow@0.2.3"
  # Our own engine, published from core's CI on 2026-11-02 (STA-1966).
  - "@stackra/console@0.6.1"
  - "@stackra/container@0.6.1"
  - "@stackra/contracts@0.6.1"
  - "@stackra/validation@0.6.1"
