# Figentra Flow file contract:
# Purpose: git hooks — pre-commit format and lint on staged files, pre-push typecheck and tests. Advisory; CI is the
#          gate. Installed by `pnpm install` (prepare).
# Owner: release-operations
# Secrets: forbidden
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob: "*.{js,mjs,ts,json,jsonc,yaml,yml,md}"
      # oxfmt exits 2 when every staged file is ignored: that is not a finding.
      # The mise-pinned oxfmt runs without a workspace install, so a commit never installs; pnpm's is the fallback where
      # mise is missing (STA-2039).
      run: >-
        sh -c 'if command -v mise >/dev/null 2>&1; then mise exec -- oxfmt --check "$@"; else pnpm exec oxfmt --check "$@"; fi;
        s=$?; [ $s -eq 2 ] && exit 0; exit $s' -- {staged_files}
    - name: oxlint
      glob: "*.{js,mjs,ts}"
      run: sh -c 'if command -v mise >/dev/null 2>&1; then exec mise exec -- oxlint "$@"; fi; exec pnpm exec oxlint "$@"' -- {staged_files}

pre-push:
  jobs:
    - name: typecheck-test
      run: pnpm exec turbo run typecheck test
