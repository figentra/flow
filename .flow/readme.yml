# The README's data (STA-1879): `figentra-flow readme` renders README.md from this file through the preset's
# readme-template. Edit here, never README.md.
name: Figentra Flow
repo: figentra/flow
tagline: "Spec-driven development for agent teams: specs, approval stops, tasks, the gate, landing and releases."
banner:
  light: .github/assets/brand/banner-light.png
  dark: .github/assets/brand/banner-dark.png
status: In progress
statusNote: "0.1.0 is published and every Stackra repository runs it; the agent-team commands are still landing."
package: "@figentra-oss/flow"
docs: https://github.com/figentra/flow/blob/main/packages/figentra-flow/README.md
what: |
  Figentra Flow (`figentra-flow`, alias `fflow`) is the spec CLI for Stackra repositories. It owns spec-driven
  development end to end (ADR 0510), from `/flow-specify` to the landed change: the presets and templates, the eight
  `flow-*` commands it renders for Claude Code and OpenCode, the `.flow/` folder, the gate on a box, landing, release
  trains and releases. Adapters choose the tracker, runner, credentials and secrets per repository. Its `init` and
  `sync` also install the files every Figentra repository shares, this README layout among them.
quickstart: |
  ```sh
  pnpm add -D @figentra-oss/flow    # from the Figentra registry: @figentra-oss:registry in .npmrc
  pnpm exec figentra-flow init      # .flow/ and the flow-* skills
  pnpm exec figentra-flow doctor    # checks Node, git, the configuration and the credentials
  ```
architecture: |
  One pnpm workspace with one package, `packages/figentra-flow`: plain ESM JavaScript with JSDoc and no runtime
  dependencies.

  | Path                                  | What                                                                         |
  | ------------------------------------- | ---------------------------------------------------------------------------- |
  | `packages/figentra-flow/bin`          | the `figentra-flow` dispatcher                                               |
  | `packages/figentra-flow/src/commands` | one module per command (`init`, `sync`, `gate`, `land`, `train`, `release`…) |
  | `packages/figentra-flow/src/adapters` | the tracker and runner adapters                                              |
  | `packages/figentra-flow/assets/flow`  | the `neutral` and `stackra` presets and the base templates                   |
  | `packages/figentra-flow/schema`       | the `figentra-flow.config.json` schema                                       |
