preset:
  id: "stackra"
  name: "Stackra clarify-first workflow"
  version: "2.0.0"
  description: "Specs in .agents/specs/sta-<n>-<slug>, mandatory Impact questionnaire, clarifications marker, Linear link, and a plan gate"
  author: "stackra"
  license: "MIT"
# STA-1945 FR-17: `fflow adr reserve` takes the next number of this file under the `adr` queue lock.
queues:
  adr: "apps/docs/adr/numbers.yaml"

# What each repository gets (STA-1945 FR-6, D3): the config's `profile` names one, else `default`; `"*"` selects
# all. Every profile selects all until core's content arrives and splits them (STA-1945 PR 6); stackra-pro uses
# `framework` unless its needs come to differ.
default: framework
profiles:
  framework:
    agents: ["*"]
    skills: ["*"]
    hooks: ["*"]
  platform:
    agents: ["*"]
    skills: ["*"]
    hooks: ["*"]
  product:
    agents: ["*"]
    skills: ["*"]
    hooks: ["*"]
  brand:
    agents: ["*"]
    skills: ["*"]
    hooks: ["*"]
  starter:
    agents: ["*"]
    skills: ["*"]
    hooks: ["*"]
