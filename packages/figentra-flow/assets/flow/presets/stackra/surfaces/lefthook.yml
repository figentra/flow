# The stackra preset's git hooks (STA-1945 FR-7, AC-8), rendered into `lefthook.yml` with the repository's own
# `lefthook` jobs from flow.config.json after these. Hooks are advisory; CI is the gate.
# - oxfmt and oxlint run the mise-pinned binary, so a commit needs no workspace install; `pnpm exec` is the fallback
#   where mise is missing (Stackra STA-1865). `fflow sync` keeps mise.toml's pins at the catalog's versions.
# - oxfmt exits 2 when every staged file is on its ignore list (pnpm-lock.yaml alone): that is not a finding.
# - oxlint whose config extends @stackra/oxlint-config, and commitlint, need a workspace install; without one they
#   are skipped with a note, and CI checks the commit (os#112).
# - Every pre-push job passes on the registry's 401 alone (fflow adds the check); any other failure blocks.
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob:
        - "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
        - "*.{json,jsonc,json5,yaml,yml,toml,md,mdx}"
        - "*.{css,scss,less,html,graphql,vue}"
      run: |
        sh -c 'if command -v mise >/dev/null 2>&1; then mise exec -- oxfmt --check "$@"; else pnpm exec oxfmt --check "$@"; fi;
        s=$?; [ $s -eq 2 ] && exit 0; exit $s' -- {staged_files}
    - name: oxlint
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: |
        if [ ! -d node_modules/@stackra/oxlint-config ] && grep -qs @stackra/oxlint-config .oxlintrc.json .oxlintrc.jsonc; then
          echo "oxlint skipped: its config extends @stackra/oxlint-config and no workspace install has it; CI lints this commit"
          exit 0
        fi
        sh -c 'if command -v mise >/dev/null 2>&1; then exec mise exec -- oxlint "$@"; fi; exec pnpm exec oxlint "$@"' -- {staged_files}
    - name: gitleaks
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner --redact
        else
          echo "gitleaks not installed (mise install); CI still scans"
        fi
commit-msg:
  jobs:
    - name: commitlint
      run: |
        if [ -x node_modules/.bin/commitlint ]; then
          node_modules/.bin/commitlint --edit {1}
        else
          echo "commitlint not installed (pnpm install); the Quality Gate checks the pull request's commits"
        fi
pre-push:
  jobs:
    # Warns on a branch without a tracker key; never blocks (ADR 0065 D5).
    - name: spec-branch
      run: |
        if [ -f node_modules/@figentra-oss/flow/bin/fflow.mjs ]; then
          node node_modules/@figentra-oss/flow/bin/fflow.mjs gate branch
        fi
