schema_version: "1.0"

preset:
  id: "neutral"
  name: "Neutral clarify-first workflow"
  version: "1.0.0"
  description: "Specs in .agents/specs/<key>-<slug>, a clarifications marker, the issue key, tiers and approval stops, and a plan gate"
  author: "figentra"
  license: "MIT"

requires:
  speckit_version: ">=1.0.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Spec with tier, approver, issue and clarifications fields"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan whose nine sections are the design"
      replaces: "plan-template"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks that cover acceptance criteria and name files"
      replaces: "tasks-template"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Resolve the spec folder from the issue key"
      strategy: "wrap"

tags:
  - "governance"
